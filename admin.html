<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel do estúdio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--c:#111111;--ink:#1c1c1a;--mut:#737373;--line:#EAEAEA;--bg:#FFFFFF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:300 15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 80px}
h1{font:400 26px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--c);margin:0}
h3{margin:22px 0 8px}
.m{color:var(--mut);font-size:13px}
nav{display:flex;gap:6px;margin:16px 0;flex-wrap:wrap}
button,input{font:inherit}
.tab,.b{padding:8px 14px;border:1px solid var(--line);border-radius:16px;background:#fff;cursor:pointer;color:var(--ink)}
.tab.on,.b.p{background:var(--c);border-color:var(--c);color:#fff}
.b.d{color:#a33}
button:focus-visible,input:focus-visible{outline:2px solid var(--c);outline-offset:2px}
input{padding:10px;border:1px solid var(--line);border-radius:16px;background:#fff;width:100%;margin-bottom:8px}
.grid{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:start}
.row{padding:12px;border:1px solid var(--line);border-radius:16px;background:#fff;margin:8px 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.row.pend{border-color:#c98a2b;background:#fdf6ea}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#login{max-width:340px;margin:12vh auto}
#st{font-size:13px}.ok{color:#1d7a3f}.bad{color:#a33}
#t{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:92%;background:#1c1c1a;color:#fff;padding:11px 16px;border-radius:16px;display:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="login" hidden>
  <h1>Entrar no painel</h1>
  <p class="m">Use o e-mail e a senha criados em Authentication &gt; Users no Supabase.</p>
  <input id="em" type="email" placeholder="E-mail" autocomplete="username">
  <input id="pw" type="password" placeholder="Senha" autocomplete="current-password">
  <button class="b p" id="li" style="width:100%">Entrar</button>
</main>

<main id="app" hidden>
  <h1 id="title">Painel</h1>
  <span id="st" class="m">Conectando…</span>
  <nav id="tabs">
    <button class="tab on" data-tab="ag">Agenda</button>
    <button class="tab" data-tab="sv">Serviços</button>
    <button class="tab" data-tab="pr">Profissionais</button>
    <button class="tab" data-tab="cf">Ajustes</button>
    <button class="tab" data-a="out">Sair</button>
  </nav>

  <section id="ag"></section>

  <section id="sv" hidden>
    <div class="grid">
      <input id="sn" placeholder="Nome do serviço"><input id="sp" type="number" min="0" placeholder="Preço">
      <input id="sm" type="number" min="5" step="5" placeholder="Minutos"><button class="b p" data-a="sadd">Adicionar</button>
    </div>
    <div id="svl"></div>
  </section>

  <section id="pr" hidden>
    <div class="grid" style="grid-template-columns:1fr auto">
      <input id="pn" placeholder="Nome do profissional"><button class="b p" data-a="padd">Adicionar</button>
    </div>
    <div id="prl"></div>
  </section>

  <section id="cf" hidden>
    <label class="m">Nome do estúdio</label><input id="cn">
    <label class="m">Horário de funcionamento</label><input id="ch">
    <label class="m">Cor principal</label><input id="cc" type="color" style="height:44px">
    <label><input id="co" type="checkbox" style="width:auto"> Aceitar agendamentos online</label><br><br>
    <button class="b p" data-a="csave">Salvar ajustes</button>
    <p class="m">Link do app do cliente: <b id="lnk"></b></p>
  </section>
</main>
<div id="t" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.9"></script>
<script src="./config.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
function toast(m) { const t = $('t'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 6000); }
function today() { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); }
const STATUS = { pending: 'Aguardando aceite', confirmed: 'Confirmado', done: 'Concluído' };

if (!window.CFG || CFG.key.includes('COLE_AQUI') || CFG.url.includes('SEU-PROJETO')) {
  document.body.innerHTML = '<main><h1>Configuração pendente</h1><p>Preencha url e key no arquivo config.js (mesma pasta deste arquivo).</p></main>';
  throw new Error('config.js não preenchido');
}
const sb = supabase.createClient(CFG.url, CFG.key);
let D = { b: [], s: [], p: [], t: {} }, filled = false, started = false;

// Toda gravação passa por aqui: erro OU zero linhas afetadas vira aviso visível.
async function w(q) {
  const { data, error } = await q.select();
  if (error || !data || !data.length) {
    toast('NÃO foi salvo: ' + (error ? error.message : 'o banco recusou a gravação (faça login de novo ou rode o supabase_setup.sql).'));
    throw error || new Error('0 linhas');
  }
  return data;
}

async function load() {
  const [b, s, p, t] = await Promise.all([
    sb.from('bookings').select('*').gte('day', today()).order('day').order('time'),
    sb.from('services').select('*').order('name'),
    sb.from('professionals').select('*').order('name'),
    sb.from('studio').select('*').eq('id', 1).maybeSingle()
  ]);
  const err = b.error || s.error || p.error || t.error;
  if (err) { $('st').className = 'bad'; $('st').textContent = '● Erro: ' + err.message; return; }
  $('st').className = 'ok'; $('st').textContent = '● Conectado ao banco';
  D = { b: b.data, s: s.data, p: p.data, t: t.data || {} };
  draw();
}

function draw() {
  document.documentElement.style.setProperty('--c', D.t.color || '#111111');
  $('title').textContent = D.t.name || 'Painel';
  const pend = D.b.filter(x => x.status === 'pending').length;
  $('ag').innerHTML = (pend ? `<p><b>${pend}</b> solicitação(ões) aguardando seu aceite.</p>` : '') +
    (D.b.map(x => `<div class="row${x.status === 'pending' ? ' pend' : ''}">
      <div><b>${esc(x.day.split('-').reverse().join('/'))} às ${esc(x.time)}</b> · ${esc(x.client_name)}<br>
      <span class="m">${esc(x.service_name || 'Serviço removido')} com ${esc(x.pro_name || 'profissional removido')} · R$ ${Number(x.price || 0).toFixed(0)} · ${esc(x.pay || '')} · ${STATUS[x.status] || esc(x.status)}</span><br>
      <a class="m" target="_blank" rel="noopener" href="https://wa.me/55${esc(x.phone.replace(/\D/g, '').replace(/^55/, ''))}">${esc(x.phone)}</a></div>
      <div class="acts">
        ${x.status === 'pending' ? `<button class="b p" data-a="acc" data-id="${x.id}">Aceitar</button>` : ''}
        ${x.status === 'confirmed' ? `<button class="b" data-a="done" data-id="${x.id}">Concluir</button>` : ''}
        <button class="b d" data-a="bdel" data-id="${x.id}">${x.status === 'pending' ? 'Recusar' : 'Excluir'}</button>
      </div></div>`).join('') || '<p class="m">Nenhum agendamento de hoje em diante.</p>');
  $('svl').innerHTML = D.s.map(x => `<div class="row"><span>${esc(x.name)} · R$ ${Number(x.price).toFixed(0)} · ${x.minutes} min</span>
    <span class="acts"><button class="b" data-a="sed" data-id="${x.id}">Editar</button><button class="b d" data-a="sdel" data-id="${x.id}">Excluir</button></span></div>`).join('') || '<p class="m">Nenhum serviço ainda.</p>';
  $('prl').innerHTML = D.p.map(x => `<div class="row"><span>${esc(x.name)}</span>
    <span class="acts"><button class="b" data-a="ped" data-id="${x.id}">Renomear</button><button class="b d" data-a="pdel" data-id="${x.id}">Excluir</button></span></div>`).join('') || '<p class="m">Nenhum profissional ainda.</p>';
  if (!filled) {
    $('cn').value = D.t.name || ''; $('ch').value = D.t.hours || ''; $('cc').value = D.t.color || '#111111'; $('co').checked = D.t.online !== false;
    $('lnk').textContent = new URL('./index.html', location.href).href; filled = true;
  }
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-tab]');
  if (t) {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
    ['ag', 'sv', 'pr', 'cf'].forEach(id => $(id).hidden = id !== t.dataset.tab);
    return;
  }
  const b = e.target.closest('[data-a]'); if (!b) return;
  const { a, id } = b.dataset;
  const find = (arr) => arr.find(x => x.id === id) || {};
  try {
    if (a === 'out') { await sb.auth.signOut(); location.reload(); return; }
    if (a === 'acc') await w(sb.from('bookings').update({ status: 'confirmed' }).eq('id', id));
    else if (a === 'done') await w(sb.from('bookings').update({ status: 'done' }).eq('id', id));
    else if (a === 'bdel') { if (!confirm('Remover este agendamento?')) return; await w(sb.from('bookings').delete().eq('id', id)); }
    else if (a === 'sadd') {
      const name = $('sn').value.trim(); if (!name) return toast('Informe o nome do serviço.');
      await w(sb.from('services').insert({ name, price: Number($('sp').value) || 0, minutes: Number($('sm').value) || 45 }));
      $('sn').value = $('sp').value = $('sm').value = '';
    }
    else if (a === 'sed') {
      const s = find(D.s), name = prompt('Nome do serviço', s.name); if (name === null) return;
      const price = prompt('Preço (R$)', s.price); if (price === null) return;
      const minutes = prompt('Duração (min)', s.minutes); if (minutes === null) return;
      await w(sb.from('services').update({ name: name.trim() || s.name, price: Number(price) || 0, minutes: Number(minutes) || 45 }).eq('id', id));
    }
    else if (a === 'sdel') { if (!confirm('Excluir serviço? Agendamentos antigos continuam no histórico.')) return; await w(sb.from('services').delete().eq('id', id)); }
    else if (a === 'padd') {
      const name = $('pn').value.trim(); if (!name) return toast('Informe o nome.');
      await w(sb.from('professionals').insert({ name })); $('pn').value = '';
    }
    else if (a === 'ped') {
      const name = prompt('Novo nome', find(D.p).name); if (!name) return;
      await w(sb.from('professionals').update({ name: name.trim() }).eq('id', id));
    }
    else if (a === 'pdel') { if (!confirm('Excluir profissional? Agendamentos antigos continuam no histórico.')) return; await w(sb.from('professionals').delete().eq('id', id)); }
    else if (a === 'csave') {
      await w(sb.from('studio').update({ name: $('cn').value.trim() || 'Meu Estúdio', hours: $('ch').value.trim(), color: $('cc').value, online: $('co').checked }).eq('id', 1));
      toast('Ajustes salvos.');
    } else return;
    await load();
  } catch (_) { /* w() já avisou na tela */ }
});

async function start() {
  if (started) return; started = true;
  $('login').hidden = true; $('app').hidden = false;
  await load();
  sb.channel('adm').on('postgres_changes', { event: '*', schema: 'public', table: 'bookings' }, load).subscribe();
  setInterval(load, 15000);
}
$('li').onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
  if (error) return toast('Login falhou: ' + error.message);
  start();
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('li').click(); });
sb.auth.getSession().then(({ data }) => { if (data.session) start(); else $('login').hidden = false; });
</script>
</body>
</html>
