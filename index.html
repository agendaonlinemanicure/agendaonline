<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agendar horário</title>
<style>
:root{--c:#1f3d36;--ink:#1c1c1a;--mut:#6b6b66;--line:#e3e1da;--bg:#faf9f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,'Times New Roman',serif}
main{max-width:540px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:30px;line-height:1.15;margin:0 0 4px;color:var(--c)}
h2{font:600 15px system-ui,sans-serif;margin:26px 0 8px}
.m{color:var(--mut);font:14px system-ui,sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:8px}
button,input,select{font:15px system-ui,sans-serif}
.chip{padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}
.chip:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.chip:focus-visible,.go:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--c);outline-offset:2px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:10px}
.go{width:100%;padding:14px;border:0;border-radius:12px;background:var(--c);color:#fff;font-weight:600;cursor:pointer;margin-top:8px}
.go:disabled{opacity:.5}
.row{padding:11px 0;border-bottom:1px solid var(--line);font:14px system-ui,sans-serif}
.tag{float:right;font-size:12px;padding:2px 9px;border-radius:99px;background:#eee}
.tag.confirmed,.tag.done{background:var(--c);color:#fff}
.warn{padding:12px;border-radius:10px;background:#f5e6d3;font:14px system-ui,sans-serif}
#t{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:90%;background:#1c1c1a;color:#fff;padding:11px 16px;border-radius:12px;font:14px system-ui,sans-serif;display:none}
</style>
</head>
<body>
<main>
  <h1 id="nm">Carregando…</h1>
  <p class="m" id="hr"></p>
  <p class="warn" id="off" hidden>O agendamento online está pausado no momento.</p>
  <div id="flow">
    <h2>Profissional</h2><div class="chips" id="pros"></div>
    <h2>Serviço</h2><div class="chips" id="svcs"></div>
    <h2>Data</h2><input type="date" id="day">
    <h2>Horário</h2><div class="chips" id="slots"></div>
    <h2>Seus dados</h2>
    <input id="name" placeholder="Nome completo" autocomplete="name">
    <input id="ph" type="tel" placeholder="WhatsApp com DDD" autocomplete="tel">
    <select id="pay"><option>Pix</option><option>Cartão</option><option>Dinheiro</option></select>
    <button class="go" id="go">Solicitar agendamento</button>
  </div>
  <h2>Meus agendamentos</h2>
  <div id="mine" class="m">Digite seu WhatsApp acima para ver seus horários.</div>
</main>
<div id="t" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.9"></script>
<script src="./config.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const SLOTS = ['09:00','10:00','11:00','14:00','15:00','16:00','17:00','18:00'];
const STATUS = { pending: 'Aguardando aceite', confirmed: 'Confirmado', done: 'Concluído' };
const S = { pro: null, svc: null, time: null, pros: [], svcs: [], taken: [], st: {} };

function toast(m) {
  const t = $('t'); t.textContent = m; t.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 5000);
}
function today() { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); }

if (!window.CFG || CFG.key.includes('COLE_AQUI') || CFG.url.includes('SEU-PROJETO')) {
  $('nm').textContent = 'Configuração pendente';
  $('flow').hidden = true;
  $('hr').textContent = 'Preencha a url e a key no arquivo config.js.';
  throw new Error('config.js não preenchido');
}
const sb = supabase.createClient(CFG.url, CFG.key);

async function load() {
  const [a, b, c] = await Promise.all([
    sb.from('studio').select('*').eq('id', 1).maybeSingle(),
    sb.from('services').select('*').order('name'),
    sb.from('professionals').select('*').order('name')
  ]);
  const err = a.error || b.error || c.error;
  if (err) { toast('Sem conexão com o banco: ' + err.message); return; }
  S.st = a.data || {}; S.svcs = b.data; S.pros = c.data;
  if (!S.pros.some(p => p.id === S.pro)) S.pro = S.pros[0]?.id || null;
  if (!S.svcs.some(s => s.id === S.svc)) S.svc = S.svcs[0]?.id || null;
  await loadTaken();
  render();
}
async function loadTaken() {
  if (!S.pro) { S.taken = []; return; }
  const { data, error } = await sb.rpc('taken', { p: S.pro, d: $('day').value });
  S.taken = error ? [] : data.map(r => r.t);
}
function render() {
  document.documentElement.style.setProperty('--c', S.st.color || '#1f3d36');
  $('nm').textContent = S.st.name || 'Agendamento';
  $('hr').textContent = S.st.hours || '';
  $('off').hidden = S.st.online !== false;
  $('go').disabled = S.st.online === false;
  const chip = (k, id, label, on) => `<button class="chip${on ? ' on' : ''}" data-k="${k}" data-v="${esc(id)}">${esc(label)}</button>`;
  $('pros').innerHTML = S.pros.map(p => chip('pro', p.id, p.name, p.id === S.pro)).join('') || '<span class="m">Nenhum profissional cadastrado.</span>';
  $('svcs').innerHTML = S.svcs.map(s => chip('svc', s.id, `${s.name} · R$ ${Number(s.price).toFixed(0)}`, s.id === S.svc)).join('') || '<span class="m">Nenhum serviço cadastrado.</span>';

  const d = new Date(), now = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  const blocked = t => S.taken.includes(t) || ($('day').value === today() && t <= now);
  if (!S.time || blocked(S.time)) S.time = SLOTS.find(t => !blocked(t)) || null;
  $('slots').innerHTML = SLOTS.map(t => `<button class="chip${t === S.time ? ' on' : ''}" data-k="time" data-v="${t}" ${blocked(t) ? 'disabled' : ''}>${t}</button>`).join('');
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-k]'); if (!b) return;
  S[b.dataset.k] = b.dataset.v;
  if (b.dataset.k === 'pro') { await loadTaken(); }
  render();
});
$('day').addEventListener('change', async () => { await loadTaken(); render(); });

async function loadMine() {
  const ph = $('ph').value;
  if (ph.replace(/\D/g, '').length < 10) return;
  const { data, error } = await sb.rpc('mine', { ph });
  if (error) { $('mine').textContent = 'Erro: ' + error.message; return; }
  $('mine').innerHTML = data.length ? data.map(b => `<div class="row"><span class="tag ${esc(b.status)}">${STATUS[b.status] || esc(b.status)}</span>${esc(b.day.split('-').reverse().join('/'))} às ${esc(b.time)}<br>${esc(b.service_name || 'Serviço removido')} com ${esc(b.pro_name || 'profissional removido')}</div>`).join('') : 'Nenhum agendamento para este número.';
}
$('ph').addEventListener('input', loadMine);

$('go').onclick = async () => {
  const n = $('name').value.trim(), ph = $('ph').value.trim();
  if (!S.pro || !S.svc || !S.time) return toast('Escolha profissional, serviço e horário.');
  if (!n) return toast('Informe seu nome.');
  if (ph.replace(/\D/g, '').length < 10) return toast('Informe o WhatsApp com DDD.');
  $('go').disabled = true;
  const { error } = await sb.rpc('book', { p: S.pro, s: S.svc, d: $('day').value, t: S.time, n, ph, pay: $('pay').value });
  $('go').disabled = false;
  if (error) {
    toast(error.code === '23505' ? 'Esse horário acabou de ser ocupado. Escolha outro.' : 'Não foi possível agendar: ' + error.message);
    await loadTaken(); render(); return;
  }
  toast('Solicitação enviada! Você verá a confirmação em "Meus agendamentos".');
  S.time = null; await loadTaken(); render(); loadMine();
};

$('day').value = today(); $('day').min = today();
load();
setInterval(() => { load(); loadMine(); }, 10000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { load(); loadMine(); } });
</script>
</body>
</html>
