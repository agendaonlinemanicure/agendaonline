<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelier Agenda — Agendamento do Cliente</title>
    <meta name="theme-color" content="#111111">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Atelier Cliente">
    <link rel="manifest" href="./manifest.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '"Inter"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --brand-primary: #111111;
            --brand-bg: #FFFFFF;
            --brand-surface: #FAFAFA;
        }
        * {
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--brand-bg);
            color: #111111;
            font-weight: 300;
            letter-spacing: -0.01em;
            overflow-x: hidden;
        }
        .fade-in {
            animation: fadeIn 0.22s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .status-dot-online {
            background-color: #39FF14;
            box-shadow: 0 0 8px #39FF14, 0 0 14px rgba(57, 255, 20, 0.55);
        }
        .status-dot-offline {
            background-color: #FF2A2A;
            box-shadow: 0 0 8px #FF2A2A, 0 0 14px rgba(255, 42, 42, 0.55);
        }
        .btn-brand {
            background-color: var(--brand-primary);
            color: #FFFFFF;
        }
        .surface-brand {
            background-color: var(--brand-surface);
        }
    </style>
</head>
<body class="min-h-screen text-[#111111] antialiased selection:bg-[#111111] selection:text-white">

    <header class="sticky top-0 z-30 backdrop-blur-sm border-b border-[#EAEAEA]" style="background-color: color-mix(in srgb, var(--brand-bg) 95%, transparent);">
        <div class="max-w-3xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2.5 min-w-0">
                <span id="client-header-logo" class="w-8 h-8 rounded-full btn-brand flex items-center justify-center text-xs font-normal overflow-hidden shrink-0">
                    A
                </span>
                <div class="min-w-0">
                    <span id="client-header-name" class="text-sm font-normal text-[#111111] block truncate leading-none">
                        Atelier Studio
                    </span>
                    <span id="client-header-hours" class="text-[10px] text-[#737373] block truncate mt-0.5">
                        Seg – Sáb • 09h às 19h
                    </span>
                </div>
            </div>

            <div class="flex items-center gap-2 shrink-0">
                <span id="client-status-badge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] border border-[#EAEAEA] surface-brand">
                    <span id="client-status-dot" class="w-2 h-2 rounded-full status-dot-online"></span>
                    <span id="client-status-text">Disponível</span>
                </span>

                <button id="install-client-pwa-btn" onclick="installClientPwa()"
                        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs btn-brand hover:opacity-90 transition-opacity">
                    <i data-lucide="download" class="w-3.5 h-3.5 stroke-[1.75]"></i>
                    <span class="hidden sm:inline font-normal">Instalar App</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 py-7 space-y-6 fade-in">

        <!-- CAPA COLORIDA DO ESTABELECIMENTO -->
        <div class="relative w-full h-36 sm:h-48 rounded-2xl border border-[#EAEAEA] surface-brand overflow-hidden">
            <img id="client-cover-img"
                 src="https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=1200&q=80"
                 alt="Foto de capa do estabelecimento"
                 onerror="this.onerror=null;this.src='https://placehold.co/1200x400/F5F5F5/111111?text=ESTABELECIMENTO';"
                 class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-black/65 via-black/15 to-transparent flex items-end justify-between p-4 sm:p-5 gap-3">
                <div class="text-white flex items-center gap-3 min-w-0">
                    <span id="client-cover-logo" class="w-10 h-10 rounded-full bg-white text-[#111111] flex items-center justify-center text-sm font-normal overflow-hidden shrink-0">
                        A
                    </span>
                    <div class="min-w-0">
                        <p id="client-cover-niche" class="text-[10px] uppercase tracking-[0.16em] text-white/75 truncate">Estúdio</p>
                        <h1 id="client-cover-name" class="text-base sm:text-lg font-normal tracking-tight truncate">Atelier Studio</h1>
                    </div>
                </div>
                <span id="client-cover-hours" class="text-[11px] text-white/85 hidden sm:inline shrink-0">
                    Seg – Sáb • 09h às 19h
                </span>
            </div>
        </div>

        <div id="client-offline-notice" class="hidden p-4 rounded-2xl border border-[#E6DEC8] bg-[#FAF7F0] text-xs text-[#6B5B3E]">
            O agendamento online está temporariamente pausado pelo estabelecimento.
        </div>

        <!-- FORMULÁRIO DE AGENDAMENTO DO CLIENTE -->
        <form id="client-booking-form" onsubmit="submitClientBooking(event)" class="p-5 sm:p-6 rounded-2xl border border-[#EAEAEA] surface-brand space-y-4">
            <div class="flex items-center justify-between gap-2">
                <div>
                    <p class="text-[11px] uppercase tracking-[0.14em] text-[#737373]">Agendar Horário</p>
                    <h2 class="text-lg font-light text-[#111111]">Reserve seu atendimento</h2>
                </div>
                <button type="button" onclick="syncClientState(true)" class="text-xs text-[#737373] hover:text-[#111111] underline underline-offset-4">
                    Atualizar tabela
                </button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                <div>
                    <label class="block text-xs text-[#737373] mb-1">Seu nome</label>
                    <input id="client-name" type="text" required placeholder="Ex: Mariana Souza"
                           class="w-full px-3.5 py-2.5 rounded-xl border border-[#EAEAEA] bg-white text-sm font-light focus:outline-none focus:border-[#111111]">
                </div>
                <div>
                    <label class="block text-xs text-[#737373] mb-1">Seu WhatsApp</label>
                    <input id="client-phone" type="tel" required placeholder="(11) 99999-0000"
                           class="w-full px-3.5 py-2.5 rounded-xl border border-[#EAEAEA] bg-white text-sm font-light focus:outline-none focus:border-[#111111]">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                <div>
                    <label class="block text-xs text-[#737373] mb-1">Profissional</label>
                    <select id="client-pro-select" onchange="handleClientProOrServiceChange()"
                            class="w-full px-3.5 py-2.5 rounded-xl border border-[#EAEAEA] bg-white text-sm font-light focus:outline-none focus:border-[#111111]"></select>
                </div>
                <div>
                    <label class="block text-xs text-[#737373] mb-1">Serviço</label>
                    <select id="client-service-select" onchange="handleClientProOrServiceChange()"
                            class="w-full px-3.5 py-2.5 rounded-xl border border-[#EAEAEA] bg-white text-sm font-light focus:outline-none focus:border-[#111111]"></select>
                </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3.5">
                <div>
                    <label class="block text-xs text-[#737373] mb-1">Data</label>
                    <input id="client-date" type="date" required
                           class="w-full px-3.5 py-2.5 rounded-xl border border-[#EAEAEA] bg-white text-sm font-light focus:outline-none focus:border-[#111111]">
                </div>
                <div>
                    <label class="block text-xs text-[#737373] mb-1">Horário</label>
                    <input id="client-time" type="time" required
                           class="w-full px-3.5 py-2.5 rounded-xl border border-[#EAEAEA] bg-white text-sm font-light focus:outline-none focus:border-[#111111]">
                </div>
                <div class="col-span-2 sm:col-span-1">
                    <label class="block text-xs text-[#737373] mb-1">Forma de pagamento</label>
                    <select id="client-payment-select"
                            class="w-full px-3.5 py-2.5 rounded-xl border border-[#EAEAEA] bg-white text-sm font-light focus:outline-none focus:border-[#111111]"></select>
                </div>
            </div>

            <div class="p-3.5 rounded-xl border border-[#EAEAEA] bg-white flex items-center justify-between">
                <div>
                    <span class="block text-[11px] text-[#737373]">Resumo estimado</span>
                    <span id="client-summary-meta" class="text-xs text-[#111111]">Duração: 45 min</span>
                </div>
                <span id="client-summary-price" class="text-base font-normal text-[#111111]">R$ 120</span>
            </div>

            <button id="client-submit-btn" type="submit"
                    class="w-full py-3 rounded-xl btn-brand text-xs font-normal tracking-wide hover:opacity-90 transition-opacity">
                Solicitar agendamento
            </button>
        </form>

        <!-- MEUS AGENDAMENTOS -->
        <div class="space-y-3">
            <h3 class="text-sm font-normal text-[#111111]">Meus agendamentos</h3>
            <div id="client-my-appointments" class="space-y-2.5"></div>
        </div>
    </main>

    <div id="toast"
         class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-opacity duration-200 bg-[#111111] text-white text-xs px-4 py-2.5 rounded-full shadow-sm max-w-[92vw] text-center">
    </div>

    <script>
        const TODAY_ISO = '2026-11-25';
        const LOCAL_CFG_KEY = 'atelier_studio_cfg_v1';
        const LOCAL_DATA_KEY = 'atelier_studio_data_v1';
        const DEFAULT_COVER = 'https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=1200&q=80';

        let sbClient = null;
        let dbConnected = false;
        let deferredClientPrompt = null;

        const state = {
            studioOnline: true,
            studioName: 'Atelier Studio',
            studioNiche: 'Estúdio',
            studioHours: 'Seg – Sáb • 09h às 19h',
            studioCover: DEFAULT_COVER,
            studioLogo: '',
            themeColors: {
                primary: '#111111',
                bg: '#FFFFFF',
                surface: '#FAFAFA'
            },
            servicesCatalog: [
                { id: 's1', name: 'Corte & Visagismo', specialty: 'Atendimento', duration: 45, price: 120 },
                { id: 's2', name: 'Barba Terapia & Toalha Quente', specialty: 'Atendimento', duration: 35, price: 70 },
                { id: 's3', name: 'Manicure & Esmaltação em Gel', specialty: 'Atendimento', duration: 60, price: 95 },
            ],
            professionals: [
                { id: 'p1', name: 'Rafael Mendes', specialty: 'Profissional', serviceRates: { s1: { enabled: true, price: 130, duration: 50 }, s2: { enabled: true, price: 75, duration: 40 } } },
                { id: 'p2', name: 'Camila Rocha', specialty: 'Profissional', serviceRates: { s3: { enabled: true, price: 100, duration: 60 } } },
            ],
            paymentMethods: [
                { id: 'pay-pix', label: 'Pix', detail: 'Transferência instantânea', enabled: true },
                { id: 'pay-credit', label: 'Cartão de Crédito', detail: 'À vista ou parcelado', enabled: true },
                { id: 'pay-debit', label: 'Cartão de Débito', detail: 'Débito na maquininha', enabled: true },
                { id: 'pay-cash', label: 'Dinheiro', detail: 'Pagamento presencial', enabled: true },
            ],
            appointments: []
        };

        function loadLocalState() {
            try {
                const rawCfg = localStorage.getItem(LOCAL_CFG_KEY);
                if (rawCfg) {
                    const cfg = JSON.parse(rawCfg);
                    if (cfg.studioName) state.studioName = cfg.studioName;
                    if (cfg.studioNiche) state.studioNiche = cfg.studioNiche;
                    if (typeof cfg.studioOnline === 'boolean') state.studioOnline = cfg.studioOnline;
                    if (cfg.studioCover) state.studioCover = cfg.studioCover;
                    if (typeof cfg.studioLogo === 'string') state.studioLogo = cfg.studioLogo;
                    if (cfg.studioHours) state.studioHours = cfg.studioHours;
                    if (cfg.themeColors) state.themeColors = { ...state.themeColors, ...cfg.themeColors };
                }

                const rawData = localStorage.getItem(LOCAL_DATA_KEY);
                if (rawData) {
                    const d = JSON.parse(rawData);
                    if (Array.isArray(d.servicesCatalog)) state.servicesCatalog = d.servicesCatalog;
                    if (Array.isArray(d.professionals)) state.professionals = d.professionals;
                    if (Array.isArray(d.paymentMethods)) state.paymentMethods = d.paymentMethods;
                    if (Array.isArray(d.appointments)) state.appointments = d.appointments;
                }
            } catch (e) {}
        }

        function saveLocalState() {
            try {
                localStorage.setItem(LOCAL_CFG_KEY, JSON.stringify({
                    studioName: state.studioName,
                    studioNiche: state.studioNiche,
                    studioOnline: state.studioOnline,
                    studioCover: state.studioCover,
                    studioLogo: state.studioLogo,
                    studioHours: state.studioHours,
                    themeColors: state.themeColors
                }));
                localStorage.setItem(LOCAL_DATA_KEY, JSON.stringify({
                    servicesCatalog: state.servicesCatalog,
                    professionals: state.professionals,
                    paymentMethods: state.paymentMethods,
                    appointments: state.appointments
                }));
            } catch (e) {}
        }

        function initSupabase() {
            const cfg = window.SUPABASE_CONFIG;
            if (!cfg || !cfg.url || !cfg.anonKey || cfg.url.includes('COLE_AQUI')) return;
            if (!window.supabase || !window.supabase.createClient) return;
            sbClient = window.supabase.createClient(cfg.url, cfg.anonKey);
            dbConnected = true;
        }

        async function loadRemoteState() {
            loadLocalState();
            if (!dbConnected || !sbClient) return;
            const estId = (window.SUPABASE_CONFIG && window.SUPABASE_CONFIG.estabelecimentoId) || 'default';

            try {
                const { data: est, error: estErr } = await sbClient.from('estabelecimentos').select('*').eq('id', estId).maybeSingle();
                if (!estErr && est) {
                    state.studioName = est.nome || state.studioName;
                    state.studioNiche = est.nicho || state.studioNiche;
                    state.studioOnline = typeof est.online === 'boolean' ? est.online : state.studioOnline;
                    state.studioCover = est.capa_url || state.studioCover;
                    state.studioLogo = est.logo_url !== undefined && est.logo_url !== null ? est.logo_url : state.studioLogo;
                    state.studioHours = est.horario_funcionamento || state.studioHours;
                    state.themeColors = {
                        primary: est.cor_primaria || state.themeColors.primary || '#111111',
                        bg: est.cor_fundo || state.themeColors.bg || '#FFFFFF',
                        surface: est.cor_destaque || state.themeColors.surface || '#FAFAFA'
                    };
                }

                const { data: svcs, error: svcErr } = await sbClient.from('servicos').select('*').eq('ativo', true);
                if (!svcErr && Array.isArray(svcs)) {
                    state.servicesCatalog = svcs.map(s => ({
                        id: s.id, name: s.nome, specialty: s.categoria || 'Atendimento', duration: Number(s.duracao_min) || 45, price: Number(s.preco) || 0
                    }));
                }

                const { data: pros, error: proErr } = await sbClient.from('profissionais').select('*').eq('ativo', true);
                const { data: proSvcs } = await sbClient.from('profissional_servicos').select('*');
                if (!proErr && Array.isArray(pros)) {
                    state.professionals = pros.map(p => {
                        const rates = {};
                        (proSvcs || []).filter(ps => ps.profissional_id === p.id && ps.habilitado).forEach(ps => {
                            rates[ps.servico_id] = { enabled: true, price: Number(ps.preco) || 0, duration: Number(ps.duracao_min) || 45 };
                        });
                        return { id: p.id, name: p.nome, specialty: p.especialidade || 'Profissional', serviceRates: rates };
                    });
                }

                const { data: pays, error: payErr } = await sbClient.from('formas_pagamento').select('*');
                if (!payErr && Array.isArray(pays) && pays.length > 0) {
                    state.paymentMethods = pays.map(pm => ({ id: pm.id, label: pm.nome, detail: pm.descricao || '', enabled: !!pm.ativo }));
                }

                const { data: apps, error: appErr } = await sbClient.from('agendamentos').select('*').order('hora_agendamento', { ascending: true });
                if (!appErr && Array.isArray(apps)) {
                    state.appointments = apps.map(a => ({
                        id: a.id,
                        clientName: a.cliente_nome,
                        clientPhone: a.cliente_whatsapp || '',
                        proId: a.profissional_id,
                        serviceId: a.servico_id,
                        date: a.data_agendamento,
                        time: a.hora_agendamento,
                        price: Number(a.valor) || 0,
                        paymentMethod: a.forma_pagamento || 'Pix',
                        status: a.status || 'pending'
                    }));
                }

                saveLocalState();
            } catch (e) {
                console.warn('Erro ao sincronizar no app do cliente:', e);
            }
        }

        function subscribeClientRealtime() {
            if (!dbConnected || !sbClient || !sbClient.channel) return;
            try {
                sbClient
                    .channel('client-live-updates')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'estabelecimentos' }, () => syncClientState(false))
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'servicos' }, () => syncClientState(false))
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'profissionais' }, () => syncClientState(false))
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'profissional_servicos' }, () => syncClientState(false))
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'formas_pagamento' }, () => syncClientState(false))
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'agendamentos' }, () => syncClientState(false))
                    .subscribe();
            } catch (e) {
                console.warn('Realtime indisponível no cliente, mantendo sincronização automática.', e);
            }
        }

        function applyClientThemeAndBranding() {
            document.documentElement.style.setProperty('--brand-primary', state.themeColors.primary);
            document.documentElement.style.setProperty('--brand-bg', state.themeColors.bg);
            document.documentElement.style.setProperty('--brand-surface', state.themeColors.surface);

            document.getElementById('client-header-name').textContent = state.studioName;
            document.getElementById('client-header-hours').textContent = state.studioHours;
            document.getElementById('client-cover-name').textContent = state.studioName;
            document.getElementById('client-cover-niche').textContent = state.studioNiche;
            document.getElementById('client-cover-hours').textContent = state.studioHours;
            document.getElementById('client-cover-img').src = state.studioCover;

            const initial = (state.studioName || 'A').trim().charAt(0).toUpperCase() || 'A';
            const headerLogo = document.getElementById('client-header-logo');
            const coverLogo = document.getElementById('client-cover-logo');

            if (state.studioLogo) {
                const imgHtml = `<img src="${state.studioLogo}" alt="Logo" class="w-full h-full object-cover">`;
                headerLogo.innerHTML = imgHtml;
                coverLogo.innerHTML = imgHtml;
            } else {
                headerLogo.textContent = initial;
                coverLogo.textContent = initial;
            }

            const dot = document.getElementById('client-status-dot');
            const label = document.getElementById('client-status-text');
            const notice = document.getElementById('client-offline-notice');
            const submitBtn = document.getElementById('client-submit-btn');

            if (state.studioOnline) {
                dot.classList.remove('status-dot-offline');
                dot.classList.add('status-dot-online');
                label.textContent = 'Disponível';
                notice.classList.add('hidden');
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                dot.classList.remove('status-dot-online');
                dot.classList.add('status-dot-offline');
                label.textContent = 'Pausado';
                notice.classList.remove('hidden');
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        function populateClientFormOptions() {
            const proSel = document.getElementById('client-pro-select');
            const svcSel = document.getElementById('client-service-select');
            const paySel = document.getElementById('client-payment-select');

            const prevPro = proSel.value;
            const prevSvc = svcSel.value;
            const prevPay = paySel.value;

            proSel.innerHTML = state.professionals.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            if (prevPro && state.professionals.some(p => p.id === prevPro)) proSel.value = prevPro;

            svcSel.innerHTML = state.servicesCatalog.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
            if (prevSvc && state.servicesCatalog.some(s => s.id === prevSvc)) svcSel.value = prevSvc;

            const activePays = state.paymentMethods.filter(m => m.enabled);
            const listPays = activePays.length ? activePays : state.paymentMethods;
            paySel.innerHTML = listPays.map(m => `<option value="${m.label}">${m.label}</option>`).join('');
            if (prevPay && listPays.some(m => m.label === prevPay)) paySel.value = prevPay;

            handleClientProOrServiceChange();
        }

        function handleClientProOrServiceChange() {
            const proId = document.getElementById('client-pro-select').value;
            const svcId = document.getElementById('client-service-select').value;
            const pro = state.professionals.find(p => p.id === proId);
            const svc = state.servicesCatalog.find(s => s.id === svcId);

            if (!svc) {
                document.getElementById('client-summary-meta').textContent = 'Selecione um serviço';
                document.getElementById('client-summary-price').textContent = 'R$ 0';
                return;
            }

            const custom = pro && pro.serviceRates && pro.serviceRates[svcId] && pro.serviceRates[svcId].enabled
                ? pro.serviceRates[svcId]
                : null;

            const price = custom ? Number(custom.price) : Number(svc.price);
            const duration = custom ? Number(custom.duration) : Number(svc.duration);

            document.getElementById('client-summary-meta').textContent = `Duração: ${duration} min`;
            document.getElementById('client-summary-price').textContent = `R$ ${price}`;
        }

        function renderClientAppointmentsList() {
            const box = document.getElementById('client-my-appointments');
            if (!state.appointments.length) {
                box.innerHTML = `<div class="p-6 rounded-2xl border border-dashed border-[#EAEAEA] text-center text-xs text-[#737373]">Nenhum agendamento registrado ainda.</div>`;
                return;
            }
            box.innerHTML = state.appointments.map(app => {
                const pro = state.professionals.find(p => p.id === app.proId) || { name: 'Profissional' };
                const svc = state.servicesCatalog.find(s => s.id === app.serviceId) || { name: 'Serviço' };
                const statusLabel = app.status === 'pending'
                    ? 'Aguardando aceite'
                    : app.status === 'done'
                        ? 'Concluído'
                        : 'Confirmado';

                return `
                    <div class="p-4 rounded-2xl border border-[#EAEAEA] bg-white flex items-center justify-between gap-3">
                        <div>
                            <p class="text-sm font-normal text-[#111111]">${svc.name} • ${app.time}</p>
                            <p class="text-xs text-[#737373]">${app.clientName} • ${pro.name} • ${app.date}</p>
                        </div>
                        <div class="text-right">
                            <span class="block text-sm font-normal text-[#111111]">R$ ${app.price}</span>
                            <span class="text-[11px] text-[#737373]">${statusLabel}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function submitClientBooking(event) {
            event.preventDefault();
            if (!state.studioOnline) {
                showToast('Agendamento online pausado no momento.');
                return;
            }

            const proId = document.getElementById('client-pro-select').value;
            const svcId = document.getElementById('client-service-select').value;
            const pro = state.professionals.find(p => p.id === proId);
            const svc = state.servicesCatalog.find(s => s.id === svcId);
            const custom = pro && pro.serviceRates && pro.serviceRates[svcId] && pro.serviceRates[svcId].enabled
                ? pro.serviceRates[svcId]
                : null;
            const price = custom ? Number(custom.price) : Number(svc ? svc.price : 0);

            const newItem = {
                id: 'a-' + Date.now(),
                clientName: document.getElementById('client-name').value.trim(),
                clientPhone: document.getElementById('client-phone').value.trim(),
                proId,
                serviceId: svcId,
                date: document.getElementById('client-date').value || TODAY_ISO,
                time: document.getElementById('client-time').value || '09:00',
                price,
                paymentMethod: document.getElementById('client-payment-select').value || 'Pix',
                status: 'pending'
            };

            state.appointments.push(newItem);
            saveLocalState();

            if (dbConnected && sbClient) {
                const { error } = await sbClient.from('agendamentos').insert({
                    id: newItem.id,
                    cliente_nome: newItem.clientName,
                    cliente_whatsapp: newItem.clientPhone,
                    profissional_id: newItem.proId,
                    servico_id: newItem.serviceId,
                    data_agendamento: newItem.date,
                    hora_agendamento: newItem.time,
                    valor: newItem.price,
                    forma_pagamento: newItem.paymentMethod,
                    status: 'pending'
                });
                if (error) {
                    console.warn('Erro ao enviar agendamento para o Supabase:', error.message);
                }
            }

            renderClientAppointmentsList();
            showToast('Solicitação enviada! Aguardando aceite do estabelecimento.');
        }

        async function syncClientState(showMsg = false) {
            await loadRemoteState();
            applyClientThemeAndBranding();
            populateClientFormOptions();
            renderClientAppointmentsList();
            if (showMsg) showToast('Dados atualizados.');
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredClientPrompt = e;
        });

        async function installClientPwa() {
            if (deferredClientPrompt) {
                deferredClientPrompt.prompt();
                await deferredClientPrompt.userChoice;
                deferredClientPrompt = null;
                return;
            }
            const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
            showToast(isIos
                ? 'No iPhone (Safari), toque em Compartilhar e depois "Adicionar à Tela de Início".'
                : 'No menu do navegador (⋮), toque em "Instalar aplicativo" ou "Adicionar à tela inicial".');
        }

        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.remove('opacity-0');
            el.classList.add('opacity-100');
            clearTimeout(window._toastT);
            window._toastT = setTimeout(() => {
                el.classList.remove('opacity-100');
                el.classList.add('opacity-0');
            }, 3000);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('client-date').value = TODAY_ISO;
            document.getElementById('client-time').value = '10:00';
            initSupabase();
            await syncClientState(false);
            subscribeClientRealtime();
            if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
            lucide.createIcons();

            setInterval(() => {
                syncClientState(false);
            }, 10000);

            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) syncClientState(false);
            });

            window.addEventListener('pageshow', () => {
                syncClientState(false);
            });

            window.addEventListener('focus', () => {
                syncClientState(false);
            });

            window.addEventListener('storage', (e) => {
                if (e.key === LOCAL_CFG_KEY || e.key === LOCAL_DATA_KEY) {
                    syncClientState(false);
                }
            });
        });
    </script>
</body>
</html>
